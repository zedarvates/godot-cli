name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run portable test suite
        run: npm test

      - name: Audit production dependencies
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify publishable package
        if: matrix.node == 22
        run: npm publish --dry-run

  godot-runtime:
    name: Godot 4.7.1 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_ARCHIVE_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install verified Godot runtime
        shell: bash
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.1-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "${GODOT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          godot_bin="$install_dir/Godot_v4.7.1-stable_linux.x86_64"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Confirm Godot version
        run: '"$GODOT_BIN" --version'

      - name: Run real Godot integration suite
        run: npm test
